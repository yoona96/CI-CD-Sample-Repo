name: CI via Repository Dispatch (Multi-repo + Static Analysis)

on:
  repository_dispatch:
    types: [trigger-ci]

jobs:
  external-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Print incoming info
        run: |
          echo "🔗 Repository: ${{ github.event.client_payload.repository }}"
          echo "🔀 Commit SHA: ${{ github.event.client_payload.commit_sha }}"

      - name: Clone appropriate repo
        run: |
          git clone https://${{ secrets.PERSONAL_TOKEN }}@github.com/${{ github.event.client_payload.repository }} repo-temp
          mv repo-temp/source-code ./source-code


      - name: Debug CMakeLists
        run: |
          echo "📂 source-code 폴더 목록"
          ls -al source-code

      - name: Set up dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake cppcheck clang-tidy libgtest-dev gcovr

      - name: Install Google Test
        run: |
          cd /usr/src/gtest
          sudo cmake .
          sudo make
          sudo cp lib/*.a /usr/lib

      - name: Download build-wrapper
        run: |
          curl -sSLo bw.zip https://sonarcloud.io/static/cpp/build-wrapper-linux-x86.zip
          unzip bw.zip
      
      - name: Run build with build-wrapper
        run: |
          mkdir -p source-code/build-wrapper-output
          ./build-wrapper-linux-x86/build-wrapper-linux-x86-64 \
            --out-dir source-code/build-wrapper-output \
            cmake -S source-code -B source-code/build
          cmake --build source-code/build


      - name: Run cppcheck
        run: |
          echo "🔍 cppcheck 실행 중"
          cppcheck source-code --enable=all --inconclusive --quiet --std=c++17 --suppress=missingIncludeSystem

      - name: Run clang-tidy
        run: |
          echo "🔍 clang-tidy 실행 중"
          cd source-code
          find . -name '*.cpp' | xargs clang-tidy -p build || true
          
      - name: Generate sonar-project.properties
        working-directory: source-code
        run: |
          echo "sonar.projectKey=yoona96_Dev-Sample-Repo" > sonar-project.properties
          echo "sonar.organization=yoona96" >> sonar-project.properties
          echo "sonar.sources=." >> sonar-project.properties
          echo "sonar.cfamily.build-wrapper-output=../build-wrapper-output" >> sonar-project.properties
      
      - name: Run SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          projectBaseDir: source-code
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
