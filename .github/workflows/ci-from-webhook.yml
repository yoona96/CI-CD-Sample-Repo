name: CI via Repository Dispatch

on:
  repository_dispatch:
    types: [trigger-ci]

jobs:
  external-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Print incoming info
        run: |
          echo "Repository: ${{ github.event.client_payload.repository }}"
          echo "Commit SHA: ${{ github.event.client_payload.commit_sha }}"

      - name: Clone external repository
        run: |
          git clone https://${{ secrets.PERSONAL_TOKEN }}@github.com/${{ github.event.client_payload.repository }} source-code
          cd source-code
          git checkout ${{ github.event.client_payload.commit_sha }}

      - name: Set up dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake cppcheck libgtest-dev

      - name: Install Google Test
        run: |
          cd /usr/src/gtest
          sudo cmake .
          sudo make
          sudo cp lib/*.a /usr/lib

      - name: Build project
        run: |
          cd source-code
          mkdir -p build && cd build
          cmake ..
          make

      - name: Run tests
        run: |
          cd source-code/build
          ctest --output-on-failure
