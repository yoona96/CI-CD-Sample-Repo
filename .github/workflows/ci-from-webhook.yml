name: CI via Repository Dispatch (Multi-repo + Static Analysis)

on:
  repository_dispatch:
    types: [trigger-ci]

jobs:
  external-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Print incoming info
        run: |
          echo "🔗 Repository: ${{ github.event.client_payload.repository }}"
          echo "🔀 Commit SHA: ${{ github.event.client_payload.commit_sha }}"

      - name: Clone appropriate repo
        run: |
          git clone https://${{ secrets.PERSONAL_TOKEN }}@github.com/${{ github.event.client_payload.repository }} source-code
          cd source-code
          git checkout ${{ github.event.client_payload.commit_sha }}

      - name: Set up dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake cppcheck clang-tidy libgtest-dev gcovr

      - name: Install Google Test
        run: |
          cd /usr/src/gtest
          sudo cmake .
          sudo make
          sudo cp lib/*.a /usr/lib

      - name: Build and Test - Dev_Sample_Repo
        if: ${{ github.event.client_payload.repository == 'yoona96/Dev_Sample_Repo' }}
        run: |
          echo "🚧 빌드 중: Dev_Sample_Repo"
          cd source-code
          mkdir -p build && cd build
          cmake .. -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          make
          ctest --output-on-failure

      - name: Build and Test - Dev_sample2
        if: ${{ github.event.client_payload.repository == 'yoona96/Dev_sample2' }}
        run: |
          echo "🚧 빌드 중: Dev_sample2"
          cd source-code
          mkdir -p build && cd build
          cmake .. -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          make
          ctest --output-on-failure

      - name: Set SonarCloud ENV by Repository
        id: sonar-env
        run: |
          REPO="${{ github.event.client_payload.repository }}"
          echo "💡 입력된 Repo: $REPO"
          
          if [ "$REPO" = "yoona96/Dev_Sample_Repo" ]; then
            echo "SONAR_PROJECT_KEY=yoona96_Dev_Sample_Repo" >> $GITHUB_OUTPUT
            echo "SONAR_ORGANIZATION=yoona96" >> $GITHUB_OUTPUT
          elif [ "$REPO" = "yoona96/Dev_sample2" ]; then
            echo "SONAR_PROJECT_KEY=yoona96_Dev_sample2" >> $GITHUB_OUTPUT
            echo "SONAR_ORGANIZATION=yoona96" >> $GITHUB_OUTPUT
          else
            echo "❗ 예상치 못한 레포: $REPO"
            exit 1
          fi


      - name: Run cppcheck
        run: |
          echo "🔍 cppcheck 실행 중"
          cppcheck source-code --enable=all --inconclusive --quiet --std=c++17 --suppress=missingIncludeSystem

      - name: Run clang-tidy
        run: |
          echo "🔍 clang-tidy 실행 중"
          cd source-code
          find . -name '*.cpp' | xargs clang-tidy -p build || true

      - name: Run SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          projectBaseDir: source-code
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ steps.sonar-env.outputs.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ steps.sonar-env.outputs.SONAR_ORGANIZATION }}
