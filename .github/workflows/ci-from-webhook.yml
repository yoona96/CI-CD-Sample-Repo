name: CI via Repository Dispatch (Multi-repo + Static Analysis)

on:
  repository_dispatch:
    types: [trigger-ci]

jobs:
  external-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Print incoming info
        run: |
          echo "🔗 Repository: ${{ github.event.client_payload.repository }}"
          echo "🔀 Commit SHA: ${{ github.event.client_payload.commit_sha }}"

      - name: Clone appropriate repo
        run: |
          git clone https://${{ secrets.PERSONAL_TOKEN }}@github.com/${{ github.event.client_payload.repository }} repo-temp
          mv repo-temp/source-code ./source-code
          mv repo-temp/sonar-project.properties ./sonar-project.properties


      - name: Debug CMakeLists
        run: |
          echo "📂 source-code 폴더 목록"
          ls -al source-code

      - name: Set up dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake cppcheck clang-tidy libgtest-dev gcovr

      - name: Install Google Test
        run: |
          cd /usr/src/gtest
          sudo cmake .
          sudo make
          sudo cp lib/*.a /usr/lib
          
      - name: Download build-wrapper
        run: |
          curl -sSLo build-wrapper-linux-x86.zip https://sonarcloud.io/static/cpp/build-wrapper-linux-x86.zip
          unzip build-wrapper-linux-x86.zip
  
      - name: Build inside build-wrapper
        run: |
          mkdir build
          cd build
          cmake ../source-code
          ls -al   # Makefile 생성됐는지 확인
          ../build-wrapper-linux-x86/build-wrapper-linux-x86-64 --out-dir ../bw-output make VERBOSE=1
      
      - name: Debug build artifacts and build-wrapper output
        run: |
          echo "📁 build 디렉토리 파일 목록"
          find build -type f || echo "build 디렉토리 없음"
      
          echo "📁 bw-output 디렉토리 확인"
          find bw-output -type f || echo "bw-output 디렉토리 없음"

      - name: Run cppcheck
        run: |
          echo "🔍 cppcheck 실행 중"
          cppcheck source-code --enable=all --inconclusive --quiet --std=c++17 --suppress=missingIncludeSystem

      - name: Run clang-tidy
        run: |
          echo "🔍 clang-tidy 실행 중"
          cd source-code
          find . -name '*.cpp' | xargs clang-tidy -p build || true

      - name: Download sonar-scanner
        run: |
          curl -sSLo sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip
          unzip sonar-scanner.zip
          mv sonar-scanner-* sonar-scanner
  
      - name: Confirm properties file is where expected
        run: |
          echo "🔍 Looking for sonar-project.properties..."
          ls -al dev-source/
          cat dev-source/sonar-project.properties

      - name: Run SonarCloud scanner manually
        run: |
          sonar-scanner/bin/sonar-scanner \
            -Dproject.settings=dev-source/sonar-project.properties \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}
